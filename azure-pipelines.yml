trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: '8.0.x'
  nodeVersion: '22.x'

stages:
  - stage: Backend
    displayName: Backend (.NET 8)
    jobs:
      - job: BuildAndTest
        displayName: Build, test and package
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - script: dotnet restore backend/ProjectNet.sln
            displayName: Restore

          - script: dotnet build backend/ProjectNet.sln --configuration $(buildConfiguration) --no-restore
            displayName: Build

          - script: dotnet test backend/ProjectNet.sln --configuration $(buildConfiguration) --no-build
            displayName: Unit tests (TDD)

          - script: dotnet publish backend/src/ProjectNet.Api/ProjectNet.Api.csproj --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api
            displayName: Publish API

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/api
              ArtifactName: orders-api

  - stage: Frontend
    displayName: Frontend (Angular)
    dependsOn: []
    jobs:
      - job: BuildAngular
        displayName: Build Angular app
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: frontend
            displayName: Install dependencies

          - script: npm run build
            workingDirectory: frontend
            displayName: Angular production build

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: frontend/dist/frontend
              ArtifactName: frontend

  - stage: Container
    displayName: Build and push container image
    dependsOn: Backend
    condition: succeeded()
    jobs:
      - job: Docker
        displayName: Build image
        steps:
          - task: Docker@2
            inputs:
              command: build
              Dockerfile: backend/Dockerfile
              tags: |
                projectnet/orders-api:$(Build.BuildId)
                projectnet/orders-api:latest
