<section class="container narrow">
  <header class="toolbar">
    <h1>New Order</h1>
    <a routerLink="/" class="btn">Back</a>
    <a routerLink="/customers/create" class="btn btn-primary">New Customer</a>
  </header>

  @if (error()) { <p class="error">{{ error() }}</p> }

  <form [formGroup]="form" (ngSubmit)="submit()" class="card">
    <label>Customer</label>
    <select formControlName="customerId">
      <option value="">Select a customer</option>
      @for (customer of customers(); track customer.id) {
        <option [value]="customer.id">{{ customer.name }} ({{ customer.email }})</option>
      }
    </select>
    @if (form.controls.customerId.touched && form.controls.customerId.invalid) {
      <small class="error">Customer is required.</small>
    }

    <button type="submit" [disabled]="form.invalid || submitting()" class="btn btn-primary">
      {{ submitting() ? 'Creating...' : 'Create Order' }}
    </button>
  </form>
</section>
