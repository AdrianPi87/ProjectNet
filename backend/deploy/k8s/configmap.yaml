apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
  namespace: projectnet
data:
  ASPNETCORE_ENVIRONMENT: Production
  Messaging__UseRabbitMq: "false"
  ConnectionStrings__Default: "Data Source=/data/projectnet.db"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-api-data
  namespace: projectnet
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
